 <div class="game-card">
  <h2>❌⭕ Tic Tac Toe</h2>

  <div id="board">
    <button onclick="play(0)"></button>
    <button onclick="play(1)"></button>
    <button onclick="play(2)"></button>
    <button onclick="play(3)"></button>
    <button onclick="play(4)"></button>
    <button onclick="play(5)"></button>
    <button onclick="play(6)"></button>
    <button onclick="play(7)"></button>
    <button onclick="play(8)"></button>
  </div>

  <h3 id="status">Player X Turn</h3>
  <button onclick="resetGame()">Restart</button>
</div>

<style>
.game-card{
  text-align:center;
  margin:30px;
}

#board{
  display:grid;
  grid-template-columns:repeat(3,80px);
  gap:5px;
  justify-content:center;
}

#board button{
  width:80px;
  height:80px;
  font-size:35px;
  cursor:pointer;
}
</style>

<script>
let board = ["","","","","","","","",""];
let player = "X";

function play(index){
  if(board[index]==""){
    board[index]=player;
    document.querySelectorAll("#board button")[index].innerHTML=player;

    if(checkWinner()){
      document.getElementById("status").innerHTML=player+" Wins 🎉";
      return;
    }

    player = player=="X" ? "O" : "X";
    document.getElementById("status").innerHTML="Player "+player+" Turn";
  }
}

function checkWinner(){
  let win=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return win.some(a=>{
    return board[a[0]] &&
    board[a[0]]==board[a[1]] &&
    board[a[1]]==board[a[2]];
  });
}

function resetGame(){
  location.reload();
}
</script>
</body>
</html>



function resetGame(){
location.reload();
}
</script>
