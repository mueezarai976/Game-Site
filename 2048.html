<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 Dark Gaming Edition</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1f2937, #0b1020 60%);
    font-family: Inter, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .game-container {
    width: min(92vw, 460px);
    background: rgba(17, 24, 39, 0.95);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 2.8rem);
    letter-spacing: 1px;
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .score-box {
    min-width: 90px;
    background: #111827;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 10px 12px;
    text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .score-box .label {
    display: block;
    font-size: 0.72rem;
    color: #9ca3af;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .score-box .value {
    font-size: 1.2rem;
    font-weight: 700;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .hint {
    color: #cbd5e1;
    font-size: 0.9rem;
    opacity: 0.9;
  }

  button {
    border: none;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    padding: 12px 18px;
    border-radius: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 25px rgba(99,102,241,0.35);
  }

  button:hover {
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(1px) scale(0.98);
  }

  .board-wrapper {
    position: relative;
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #111827;
    border-radius: 22px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    touch-action: none;
    user-select: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 -1px 0 rgba(0,0,0,0.4);
  }

  .cell {
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
  }

  .tile-layer {
    position: absolute;
    inset: 12px;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 16px;
    font-weight: 800;
    transition:
      left 0.14s ease,
      top 0.14s ease,
      transform 0.16s ease,
      opacity 0.16s ease;
    animation: pop 0.18s ease;
    box-shadow:
      0 10px 25px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }

  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .tile-2    { background:#1f2937; color:#f8fafc; }
  .tile-4    { background:#334155; color:#f8fafc; }
  .tile-8    { background:#2563eb; color:#fff; }
  .tile-16   { background:#3b82f6; color:#fff; }
  .tile-32   { background:#0ea5e9; color:#fff; }
  .tile-64   { background:#06b6d4; color:#fff; }
  .tile-128  { background:#10b981; color:#fff; font-size:0.9em; }
  .tile-256  { background:#22c55e; color:#fff; font-size:0.9em; }
  .tile-512  { background:#84cc16; color:#111827; font-size:0.9em; }
  .tile-1024 { background:#f59e0b; color:#111827; font-size:0.75em; }
  .tile-2048 { background:#f97316; color:#fff; font-size:0.75em; }
  .tile-super{ background:#ef4444; color:#fff; font-size:0.72em; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(2,6,23,0.82);
    border-radius: 22px;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .overlay.show {
    display: flex;
  }

  .overlay-content {
    max-width: 280px;
  }

  .overlay h2 {
    margin: 0 0 10px;
    font-size: 2rem;
  }

  .overlay p {
    margin: 0 0 18px;
    color: #cbd5e1;
  }

  .footer {
    margin-top: 16px;
    text-align: center;
    color: #94a3b8;
    font-size: 0.85rem;
  }

  @media (max-width: 480px) {
    .game-container {
      padding: 16px;
      border-radius: 22px;
    }

    .score-box {
      min-width: 78px;
      padding: 8px 10px;
    }

    .controls {
      align-items: stretch;
    }

    .controls button {
      width: 100%;
    }

    .hint {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="label">Best</span>
        <span class="value" id="best">0</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="hint">Use arrow keys or swipe to move tiles</div>
    <button id="restartBtn">Restart</button>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <div class="tile-layer" id="tileLayer"></div>

    <div class="overlay" id="gameOver">
      <div class="overlay-content">
        <h2>Game Over</h2>
        <p>No more moves available. Try again!</p>
        <button id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div class="footer">Dark Gaming Edition • Responsive • Smooth Animations</div>
</div>

<script>
const SIZE = 4;
let board = [];
let score = 0;
let best = parseInt(localStorage.getItem('best2048')) || 0;

const boardEl = document.getElementById('board');
const tileLayer = document.getElementById('tileLayer');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const gameOverEl = document.getElementById('gameOver');

bestEl.textContent = best;

// Build static grid
for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  boardEl.appendChild(cell);
}

function init() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0;
  updateScore();
  gameOverEl.classList.remove('show');
  addRandomTile();
  addRandomTile();
  render();
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('best2048', best);
  }
  bestEl.textContent = best;
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) empty.push({ r, c });
    }
  }
  if (!empty.length) return;
  const { r, c } = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  tileLayer.innerHTML = '';

  const rect = boardEl.getBoundingClientRect();
  const gap = 12;
  const cellSize = (rect.width - gap * 5) / 4;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const value = board[r][c];
      if (!value) continue;

      const tile = document.createElement('div');
      tile.className = 'tile ' + (value <= 2048 ? 'tile-' + value : 'tile-super');
      tile.textContent = value;

      tile.style.width = cellSize + 'px';
      tile.style.height = cellSize + 'px';
      tile.style.left = (c * (cellSize + gap)) + 'px';
      tile.style.top = (r * (cellSize + gap)) + 'px';

      const fontSize = value < 100 ? cellSize * 0.36 :
                       value < 1000 ? cellSize * 0.28 :
                       cellSize * 0.22;

      tile.style.fontSize = fontSize + 'px';

      tileLayer.appendChild(tile);
    }
  }
}

function rotateClockwise(matrix) {
  const n = matrix.length;
  const res = Array.from({ length: n }, () => Array(n).fill(0));
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      res[c][n - 1 - r] = matrix[r][c];
    }
  }
  return res;
}

function moveLeft() {
  let moved = false;

  for (let r = 0; r < SIZE; r++) {
    let row = board[r].filter(v => v);

    for (let i = 0; i < row.length - 1; i++) {
      if (row[i] === row[i + 1]) {
        row[i] *= 2;
        score += row[i];
        row[i + 1] = 0;
        moved = true;
      }
    }

    row = row.filter(v => v);

    while (row.length < SIZE) row.push(0);

    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== row[c]) moved = true;
      board[r][c] = row[c];
    }
  }

  return moved;
}

function move(direction) {
  let moved = false;

  if (direction === 'left') {
    moved = moveLeft();
  } else if (direction === 'right') {
    board = rotateClockwise(rotateClockwise(board));
    moved = moveLeft();
    board = rotateClockwise(rotateClockwise(board));
  } else if (direction === 'up') {
    board = rotateClockwise(rotateClockwise(rotateClockwise(board)));
    moved = moveLeft();
    board = rotateClockwise(board);
  } else if (direction === 'down') {
    board = rotateClockwise(board);
    moved = moveLeft();
    board = rotateClockwise(rotateClockwise(rotateClockwise(board)));
  }

  if (moved) {
    addRandomTile();
    updateScore();
    render();

    if (isGameOver()) {
      setTimeout(() => gameOverEl.classList.add('show'), 250);
    }
  }
}

function isGameOver() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return false;
      if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
      if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
    }
  }
  return true;
}

// Keyboard controls
document.addEventListener('keydown', e => {
  if (gameOverEl.classList.contains('show')) return;

  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      move('left');
      break;
    case 'ArrowRight':
      e.preventDefault();
      move('right');
      break;
    case 'ArrowUp':
      e.preventDefault();
      move('up');
      break;
    case 'ArrowDown':
      e.preventDefault();
      move('down');
      break;
  }
});

// Swipe controls
let startX = 0;
let startY = 0;

boardEl.addEventListener('touchstart', e => {
  const t = e.touches[0];
  startX = t.clientX;
  startY = t.clientY;
}, { passive: true });

boardEl.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left');
  } else {
    if (Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up');
  }
});

// Buttons
document.getElementById('restartBtn').addEventListener('click', init);
document.getElementById('playAgainBtn').addEventListener('click', init);

// Resize handling
window.addEventListener('resize', render);

init();
</script>
</body>
</html>
